name: Release

# The release is a consequence of merging. changepack is installed from the npm
# registry, and three versions shipped untagged because tagging depended on
# somebody remembering. Tagging is idempotent and safe to repeat; publishing is
# not, so each step asks whether its own outcome already holds: the tag, of the
# remote, and the version, of the registry. The publish never reads the tag,
# because a tag written seconds ago proves nothing about what the registry has.
#
# Nothing here holds a credential. The registry trusts this workflow by name,
# through OIDC, and mints a token that lives for the length of the publish. An
# absent trust relationship fails at the publish with an authentication error,
# which is as loud as the token check it replaced.

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Read the version once
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Tag the version where no tag carries it
        run: |
          set -euo pipefail
          tag="v${{ steps.version.outputs.value }}"
          if [ -n "$(git ls-remote --tags --refs origin "refs/tags/$tag")" ]; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git tag "$tag"
          git push origin "refs/tags/$tag"
          echo "Tagged $tag."

      # Trusted publishing wants npm 11.5.1 or later. Node 24 carries a new
      # enough npm today, and this says so rather than trusting what the
      # runtime image happens to bundle next month.
      - name: Use an npm that can publish over OIDC
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm --version

      - name: Ask the registry whether it already holds this version
        id: published
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.value }}"
          name="$(node -p "require('./package.json').name")"
          code="$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/$name/$version")"
          case "$code" in
            200) echo "held=true" >> "$GITHUB_OUTPUT"; echo "$name@$version is already published." ;;
            404) echo "held=false" >> "$GITHUB_OUTPUT"; echo "$name@$version is not on the registry." ;;
            *) echo "::error::The registry answered $code for $name/$version. Refusing to guess."; exit 1 ;;
          esac

      # `--provenance` is documented as automatic under trusted publishing and
      # is passed anyway: it is inert where that holds and required where it
      # does not, and a release is the wrong place to find out which.
      - name: Publish where the registry does not hold it
        if: steps.published.outputs.held == 'false'
        run: npm publish --provenance --access public
